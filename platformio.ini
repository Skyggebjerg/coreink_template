[env:m5stack-coreink]
platform  = espressif32
board     = m5stack-coreink
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600
; ── adjust upload_port to match your system ──────────────────
; upload_port  = COM22        ; Windows example
; upload_port  = /dev/ttyUSB0 ; Linux example

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    ; M5Stack display & hardware abstraction
    https://github.com/m5stack/M5GFX/archive/refs/heads/master.zip
    https://github.com/m5stack/M5Core-Ink/archive/refs/heads/master.zip